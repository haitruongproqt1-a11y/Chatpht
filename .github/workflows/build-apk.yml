name: Build Android APK and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-debug:
    name: Build debug APK and publish tagged Release
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TURN_URL: ${{ secrets.TURN_URL }}
      TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
      TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android native project locally
        run: pnpm exec expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK with Gradle
        working-directory: android
        run: ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: Collect debug APK
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/debug -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "ChatPHT-${GITHUB_REF_NAME}-debug.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPHT-${{ github.ref_name }}-debug-apk
          path: ChatPHT-${{ github.ref_name }}-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ChatPHT-${{ github.ref_name }}-debug.apk
