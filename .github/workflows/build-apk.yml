name: Build Android APK and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build signed APK and publish Release
    runs-on: ubuntu-latest
    env:
      CI: "true"
      TURN_URL: ${{ secrets.TURN_URL }}
      TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
      TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
      CHATPHT_RELEASE_STORE_FILE: ${{ github.workspace }}/android/app/chatpht-release.keystore
      CHATPHT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CHATPHT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CHATPHT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$CHATPHT_RELEASE_STORE_PASSWORD"
          test -n "$CHATPHT_RELEASE_KEY_ALIAS"
          test -n "$CHATPHT_RELEASE_KEY_PASSWORD"

      - name: Generate Android native project locally
        run: pnpm exec expo prebuild --platform android --non-interactive --clean

      - name: Configure signing for Gradle release build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CHATPHT_RELEASE_STORE_FILE"
          cat > android/app/release-signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("CHATPHT_RELEASE_STORE_FILE"))
                storePassword System.getenv("CHATPHT_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("CHATPHT_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("CHATPHT_RELEASE_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
          printf '\napply from: "release-signing.gradle"\n' >> android/app/build.gradle

      - name: Build release APK with Gradle
        working-directory: android
        run: ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "ChatPHT-${GITHUB_REF_NAME}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPHT-${{ github.ref_name }}-apk
          path: ChatPHT-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ChatPHT-${{ github.ref_name }}.apk
